name: Capacitor 7 encrypted-storage native compile gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'security/e2ee-spike/**'
      - '.github/workflows/storage-native-compile.yml'
  push:
    branches: [diagnostics/github-runner-allocation, security/e2ee-durable-relay-storage-groups]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'security/e2ee-spike/**'
      - '.github/workflows/storage-native-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install pinned Capacitor plugins
        run: npm install

      - name: Verify exact native-storage dependency and encryption configuration
        run: |
          npm ls @capacitor-community/sqlite@7.0.3 @aparajita/capacitor-secure-storage@7.1.6
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          if (pkg.dependencies['@capacitor-community/sqlite'] !== '7.0.3') throw new Error('SQLite plugin version is not pinned');
          if (pkg.dependencies['@aparajita/capacitor-secure-storage'] !== '7.1.6') throw new Error('SecureStorage plugin version is not pinned');
          if (cfg.plugins?.CapacitorSQLite?.androidIsEncryption !== true || cfg.plugins?.CapacitorSQLite?.iosIsEncryption !== true) throw new Error('SQLCipher encryption flags are not enabled for both platforms');
          if (!cfg.plugins?.SecureStorage) throw new Error('SecureStorage plugin is not registered in Capacitor config');
          console.log('Exact plugin pins and native encryption configuration verified.');
          JS

      - name: Parse the WebView relay, media and native storage adapters
        run: |
          for file in security/e2ee-spike/client/*.mjs security/e2ee-spike/relay/*.mjs; do node --check "$file"; done

      - name: Generate isolated Android project
        run: npx cap add android

      - name: Sync native plugins
        run: npx cap sync android

      - name: Verify SQLCipher and secure-storage plugin registration
        run: |
          test -d android/app/src/main
          grep -R -q 'CapacitorSQLite' android/app/src/main
          grep -R -q 'SecureStorage' android/app/src/main
          echo 'Native plugin registration sources found.'

      - name: Compile debug APK (no release or deployment)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
