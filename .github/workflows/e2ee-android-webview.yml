name: E2EE Android WebView compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2ee-lab/**"
      - "android-webview-harness/**"
      - ".github/workflows/e2ee-android-webview.yml"
  push:
    branches:
      - "security/e2ee-android-lab"
    paths:
      - "e2ee-lab/**"
      - "android-webview-harness/**"
      - ".github/workflows/e2ee-android-webview.yml"
permissions:
  contents: read
jobs:
  android-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            android-version: "10"
          - api-level: 35
            android-version: "15"
    name: "WebView Android ${{ matrix.android-version }} (API ${{ matrix.api-level }})"
    steps:
      - name: Checkout isolated Android repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Matrix browser lab
        working-directory: e2ee-lab
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/assets/e2ee-lab/
      - name: Package browser lab into isolated Android test assets
        run: |
          mkdir -p android-webview-harness/app/src/main/assets/e2ee-lab
          cp -R e2ee-lab/dist/. android-webview-harness/app/src/main/assets/e2ee-lab/
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run instrumented test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          force-avd-creation: true
          disable-animations: true
          working-directory: android-webview-harness
          script: |
            set -o pipefail
            adb logcat -c
            ready=0
            for attempt in $(seq 1 60); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')"
              package_service="$(adb shell service check package 2>&1 || true)"
              if [ "$boot" = "1" ] && echo "$package_service" | grep -q "found"; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "Android emulator or PackageManager did not become ready"
              adb shell getprop sys.boot_completed || true
              adb shell service check package || true
              adb logcat -d -t 5000 || true
              exit 1
            fi
            trap 'adb logcat -d -t 12000 > ../webview-logcat.txt || true' EXIT
            gradle --no-daemon connectedDebugAndroidTest
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-emulator-diagnostics-api-${{ matrix.api-level }}
          path: android-webview-harness/webview-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
