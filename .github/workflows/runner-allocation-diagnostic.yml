name: GitHub runner allocation diagnostic

on:
  push:
    branches:
      - diagnostics/github-runner-allocation
    paths:
      - ".github/workflows/runner-allocation-diagnostic.yml"

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "RUNNER_ALLOCATED=ubuntu-latest"
          uname -a
          node --version
