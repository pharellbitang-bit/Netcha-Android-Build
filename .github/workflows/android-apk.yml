name: Build Netcha Android APK
# Rebuild requested for the latest Netcha Android sources.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android wrapper
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install wrapper dependencies
        run: npm install

      - name: Bundle native Firebase Messaging bridge
        run: npx esbuild www/push.js --bundle --format=iife --platform=browser --target=es2020 --outfile=www/push.bundle.js

      - name: Check embedded JavaScript syntax
        run: |
          node --check www/auth.js
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path("www/index.html").read_text(encoding="utf-8")
          scripts = re.findall('<script' + chr(92) + 'b([^>]*)>(.*?)</script' + chr(92) + 's*>', html, re.I | re.S)
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for index, (attrs, body) in enumerate(scripts):
                  if not body.strip() or 'application/json' in attrs.lower() or 'application/ld+json' in attrs.lower():
                      continue
                  path = Path(tmp) / f"netcha-inline-{index}.js"
                  path.write_text(body, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
          if not checked:
              raise SystemExit("No inline JavaScript found")
          print(f"Checked {checked} embedded JavaScript blocks")
          PY

      - name: Generate Android project
        run: npx cap add android

      - name: Declare camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
          ]
          missing = [
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if f'name="{permission}"' not in content
          ]
          if missing:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("Balise <application> introuvable")
              content = content.replace(marker, "\n".join(missing) + "\n    " + marker, 1)

          manifest.write_text(content, encoding="utf-8")
          check = manifest.read_text(encoding="utf-8")
          absent = [p for p in permissions if f'name="{p}"' not in check]
          if absent:
              raise SystemExit("Permissions absentes : " + ", ".join(absent))
          print("OK : permissions caméra, microphone et notifications vérifiées dans le manifeste.")
          PY

      - name: Configure Firebase Android push
        env:
          NETCHA_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.NETCHA_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set +e
          if [ -z "$NETCHA_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::Firebase configuration not supplied; APK will build without active FCM."
            exit 0
          fi
          printf '%s' "$NETCHA_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > /tmp/netcha-google-services.json 2>/dev/null
          if [ $? -ne 0 ] || ! python3 -c "import json; d=json.load(open('/tmp/netcha-google-services.json')); assert any(x.get('client_info',{}).get('android_client_info',{}).get('package_name') == 'com.netcha.app' for x in d.get('client',[]))" 2>/dev/null; then
            echo "::warning::Firebase config secret is invalid or is not for com.netcha.app; building APK without FCM."
            rm -f /tmp/netcha-google-services.json
            exit 0
          fi
          mkdir -p android/app
          cp /tmp/netcha-google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Gradle files Android générés introuvables")
          text = root.read_text()
          plugin = "classpath 'com.google.gms:google-services:4.4.4'"
          if plugin not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Bloc dependencies Gradle racine introuvable")
              text = text.replace(marker, marker + "\n        " + plugin, 1)
              root.write_text(text)
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              marker = "apply plugin: 'com.android.application'"
              if marker in text:
                  text = text.replace(marker, marker + "\napply plugin: 'com.google.gms.google-services'", 1)
              else:
                  marker = "plugins {"
                  if marker not in text:
                      raise SystemExit("Bloc plugins Gradle app introuvable")
                  text = text.replace(marker, marker + "\n    id 'com.google.gms.google-services'", 1)
              app.write_text(text)
          print("Google Services Gradle plugin configured.")
          PY
          echo "Firebase configuration added for com.netcha.app."

      - name: Configure Netcha launcher icon
        run: python3 scripts/configure-android-icon.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcha-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Netcha Android — version de test
          body: |
            Version de test de Netcha pour Android.

            Attention : cette version est une APK de débogage destinée aux testeurs. Elle n'est pas une version certifiée ni publiée sur Google Play. Installez-la uniquement si vous acceptez de tester une version en développement.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
